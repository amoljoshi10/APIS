# NextGen DSOMM Agents V2 — "DSOMM Agent" on-demand options (added by DSOMM Web).
# Actions → DSOMM Agent → Run workflow → choose what to do.
# Prerequisites for Self-Heal (beta), once — Settings → Secrets and variables → Actions:
#   Variables: DSOMM_AGENT_IMAGE (the DSOMM Agent image, e.g. dsomm.azurecr.io/dsomm-agent:latest)
#   Secrets:   DSOMM_TOKEN (fine-grained PAT: Actions, Contents, Pull requests, Workflows — read & write)
#              ACR_USERNAME / ACR_PASSWORD (pull access to that image)
name: DSOMM Agent

on:
  workflow_dispatch:
    inputs:
      action:
        description: What should DSOMM Agent do?
        type: choice
        options: [Assess & Implement in DSOMM Web, Self-Heal a failed run (beta)]
      run_id:
        description: "Self-Heal only: failed run id (empty = latest failed run)"
        required: false
        default: ""

jobs:
  assess-implement:
    if: inputs.action == 'Assess & Implement in DSOMM Web'
    runs-on: ubuntu-latest
    steps:
      - name: Open DSOMM assessment
        run: |
          echo "### [Open DSOMM Assessment & Implementation for this repository](https://ai-catalyst.calmmushroom-da6f9699.eastus.azurecontainerapps.io/?repo=https://github.com/${{ github.repository }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Enter your GitHub PAT in DSOMM Web, choose AutoPilot or LLM mode and press Start." >> "$GITHUB_STEP_SUMMARY"
          echo "Open DSOMM Web: https://ai-catalyst.calmmushroom-da6f9699.eastus.azurecontainerapps.io/?repo=https://github.com/${{ github.repository }}"

  self-heal:
    if: inputs.action == 'Self-Heal a failed run (beta)'
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.DSOMM_AGENT_IMAGE || 'set-the-dsomm_agent_image-repository-variable' }}
      credentials:
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    env:
      PROVIDER: github
      REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id || 'latest' }}
      TOKEN: ${{ secrets.DSOMM_TOKEN }}
      DSOMM_WEB_URL: "https://ai-catalyst.calmmushroom-da6f9699.eastus.azurecontainerapps.io"
      DRY_RUN: "false"
    steps:
      - run: python -m dsomm_agent heal
