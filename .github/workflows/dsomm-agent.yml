name: DSOMM Agent

on:
 workflow_dispatch:
 inputs:
 action:
 description: What should DSOMM Agent do?
 type: choice
 options: [Assess & Implement in DSOMM Web, Self-Heal a failed run]
run_id:
 description: "Self-Heal only: failed run id (empty = latest failed run)"
 required: false
 default: ""

jobs:
 assess-implement:
 if: inputs.action == 'Assess & Implement in DSOMM Web'
 runs-on: ubuntu-latest
 steps:
 - run: |
    echo "### 🚀 [Open DSOMM Assessment & Implementation for this repository](${{ vars.DSOMM_WEB_URL }}/?repo=https://github.com/${{ github.repository }})" >> "$GITHUB_STEP_SUMMARY"
    echo "Enter your GitHub PAT in DSOMM Web, choose AutoPilot or LLM mode and press Start." >> "$GITHUB_STEP_SUMMARY"

 self-heal:
  if: inputs.action == 'Self-Heal a failed run'
  runs-on: ubuntu-latest
 container:
 image: dsomm.azurecr.io/dsomm-agent:2.0 # <-- your registry/image
 credentials:
 username: ${{ secrets.ACR_USERNAME }}
 password: ${{ secrets.ACR_PASSWORD }}
 env:
 PROVIDER: github
 REPO: ${{ github.repository }}
 RUN_ID: ${{ inputs.run_id || 'latest' }}
 TOKEN: ${{ secrets.DSOMM_TOKEN }}
 DSOMM_WEB_URL: ${{ vars.DSOMM_WEB_URL }}
 DRY_RUN: "false"
steps:
 - run: python -m dsomm_agent heal
