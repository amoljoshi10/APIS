name: Tests - .NET
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_call: {}
permissions:
  contents: read
jobs:
  dotnet-test:
    name: .NET Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_ROLL_FORWARD: Major
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Pick the .NET SDK
        id: sdk
        run: |
          # .NET SDK: the newest netX.0 in any TargetFramework(s), at least 8.0 (a global.json, when present, wins)
          MAJOR=$(grep -rhoE --include='*.csproj' --include='*.fsproj' --include='*.vbproj' --include='*.props' '<TargetFrameworks?>[^<]*' . 2>/dev/null | grep -oE 'net[0-9]+\.[0-9]+' | sed -E 's/^net([0-9]+)\..*/\1/' | sort -n | tail -1 || true)
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 8 ]; then MAJOR=8; fi
          echo "Using .NET SDK $MAJOR.0 (unless global.json pins another)"
          echo "version=$MAJOR.0.x" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        if: hashFiles('global.json') != ''
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@v4
        if: hashFiles('global.json') == ''
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - name: Run tests
        run: |
          warn() { echo "::warning::$*"; }
          set -eo pipefail
          mkdir -p TestResults
          TESTS=$(grep -rlE --include='*.csproj' --include='*.fsproj' --include='*.vbproj' 'Microsoft\.NET\.Test\.Sdk|MSTest\.Sdk|<IsTestProject>[[:space:]]*true' . 2>/dev/null | grep -vE '/(bin|obj)/' | sort || true)
          if [ -z "$TESTS" ]; then
            warn "No test project found, so no tests ran. Add one for your security unit tests, e.g.: dotnet new xunit -o tests/MyApp.Tests, then: dotnet add tests/MyApp.Tests reference src/MyApp/MyApp.csproj"
            BUILDS=$(find . -name '*.sln' -not -path '*/bin/*' -not -path '*/obj/*' | sort)
            if [ -z "$BUILDS" ]; then BUILDS=$(find . \( -name '*.csproj' -o -name '*.fsproj' -o -name '*.vbproj' \) -not -path '*/bin/*' -not -path '*/obj/*' | sort); fi
            while IFS= read -r b; do
              if [ -n "$b" ]; then dotnet build "$b" -p:EnableWindowsTargeting=true; fi
            done <<< "$BUILDS"
            exit 0
          fi
          FAILED=0
          while IFS= read -r p; do
            RUN=""; SKIP=""
            for t in $(sed -nE 's:.*<TargetFrameworks?>([^<]*)</TargetFrameworks?>.*:\1:p' "$p" | tr ';' ' '); do
              case "$t" in
                *'$'*) ;;
                *-windows*|net[0-9][0-9]|net[0-9][0-9][0-9]) SKIP="$SKIP $t" ;;
                *) RUN="$RUN $t" ;;
              esac
            done
            if [ -n "$SKIP" ]; then warn "$p: skipped$SKIP - .NET Framework / Windows-only targets need a Windows agent"; fi
            if [ -z "$RUN" ] && [ -z "$SKIP" ]; then RUN="default"; fi
            for t in $RUN; do
              NAME=$(basename "$p" | sed -E 's/\.[a-z]+proj$//')-$t
              if [ "$t" = default ]; then FW=""; else FW="--framework $t"; fi
              echo "== dotnet test $p $FW"
              dotnet test "$p" $FW -p:EnableWindowsTargeting=true --logger "trx;LogFileName=$NAME.trx" --results-directory TestResults --blame-hang-timeout 10m || FAILED=1
            done
          done <<< "$TESTS"
          if [ "$FAILED" -ne 0 ]; then
            if grep -qs 'outcome="Failed"' TestResults/*.trx; then echo "Tests failed - see the failing tests above."; else echo "Build failed - see the errors above."; fi
            exit 1
          fi
          echo "All tests passed."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults/
          if-no-files-found: ignore
