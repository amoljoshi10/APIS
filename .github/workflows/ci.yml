# TEST ONLY — a deliberately failing "CI" workflow to try DSOMM Agent self-heal on GitHub.
# Copy to .github/workflows/ci.yml in a TEST repo (default branch), then:
# Actions → CI → Run workflow → pick a scenario.
#
# deprecated-action → expect a fix PR (upload-artifact@v3 → @v4) from branch dsomm-selfheal/<run id>
# flaky → expect ONE automatic re-run; when that fails too, a diagnosis comment on the commit
# test-failure → expect a diagnosis comment on the commit, no PR
name: CI

on:
 workflow_dispatch:
 inputs:
 scenario:
 type: choice
 options: [deprecated-action, flaky, test-failure]
 default: deprecated-action

jobs:
 deprecated-action:
 if: inputs.scenario == 'deprecated-action'
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - uses: actions/upload-artifact@v3 # retired by GitHub → the job is failed automatically
 with:
 name: readme
 path: README.md

 flaky:
 if: inputs.scenario == 'flaky'
 runs-on: ubuntu-latest
 steps:
 - run: |
 echo "curl: (28) Failed to connect to registry.example.com: ETIMEDOUT"
 exit 1

 test-failure:
 if: inputs.scenario == 'test-failure'
 runs-on: ubuntu-latest
 steps:
 - run: python3 -c "assert 1 == 2, 'expected value 1 but got 2'"
